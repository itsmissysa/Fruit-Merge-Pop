<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>FRUITY MERGE POP</title>

  <!-- Main CSS -->
  <link rel="stylesheet" href="style.css">
</head>


<body>

  <div id="app">


    <!-- ======================================================
         BACKGROUND MUSIC
    ======================================================= -->

    <audio
      id="backgroundMusic"
      src="./assets/sounds/background.mp3"
      loop
      preload="auto"
    ></audio>


    <!-- ======================================================
         HOME SCREEN
    ======================================================= -->

    <section
      id="homeScreen"
      class="screen home-screen"
    >

      <!-- Top Bar -->
      <div class="home-topbar">

        <!-- Coins -->
        <div class="coin-display">

          <span class="coin-icon">🪙</span>

          <span id="homeCoins">0</span>

        </div>


        <!-- Settings -->
        <button
          id="settingsButton"
          class="settings-btn"
          aria-label="Settings"
        >
          ⚙️
        </button>

      </div>


      <!-- ==================================================
           GAME LOGO
      =================================================== -->

      <div class="home-brand">

        <h1>FRUITY MERGE POP</h1>

        <p class="subtitle">
          DROP • MERGE • GROW
        </p>

      </div>


      <!-- ==================================================
           MAIN PLAY BUTTON
      =================================================== -->

      <button
        id="playButton"
        class="primary play-button"
      >

        <span class="play-icon">▶</span>

        PLAY

      </button>


      <!-- ==================================================
           SECONDARY BUTTONS
      =================================================== -->

      <div class="row-buttons">

        <button
          id="missionsButton"
          class="home-option"
        >

          <span>🎯</span>

          <strong>
            Missions
          </strong>

        </button>


        <button
          id="dailyButton"
          class="home-option"
        >

          <span>🎁</span>

          <strong>
            Daily
          </strong>

        </button>

      </div>


      <!-- ==================================================
           HOME TIP
      =================================================== -->

      <div class="home-tip">

        <span>💡</span>

        <p>
          Match fruits to merge them into the next fruit!
        </p>

      </div>


      <!-- ==================================================
           HIDDEN COMPATIBILITY DATA
      =================================================== -->

      <div
        class="hidden-home-data"
        aria-hidden="true"
      >

        <span id="homeHighScore">0</span>

        <span id="homeLevel">1</span>

      </div>

    </section>


    <!-- ======================================================
         GAME SCREEN
    ======================================================= -->

    <section
      id="gameScreen"
      class="screen hidden"
    >

      <!-- GAME HEADER -->

      <div class="game-header">


        <!-- Home -->
        <button
          id="homeButton"
          class="icon-btn"
          aria-label="Home"
        >
          🏠
        </button>


        <!-- Score -->
        <div class="game-stat">

          <small>
            Score
          </small>

          <b id="score">
            0
          </b>

        </div>


        <!-- Best -->
        <div class="game-stat">

          <small>
            Best
          </small>

          <b id="gameHighScore">
            0
          </b>

        </div>


        <!-- Coins -->
        <div class="game-stat">

          <small>
            Coins
          </small>

          <b>

            🪙

            <span id="coins">
              0
            </span>

          </b>

        </div>


        <!-- Pause -->
        <button
          id="pauseButton"
          class="icon-btn"
          aria-label="Pause"
        >
          ⏸
        </button>

      </div>


      <!-- NEXT FRUIT -->

      <div class="next">

        NEXT

        <span id="nextFruit">
          🍒
        </span>

      </div>


      <!-- GAME CANVAS -->

      <canvas
        id="gameCanvas"
        width="400"
        height="650"
      ></canvas>

    </section>


    <!-- ======================================================
         MISSIONS SCREEN
    ======================================================= -->

    <section
      id="missionsScreen"
      class="screen hidden"
    >

      <div class="subscreen-header">

        <button
          id="missionsBack"
          class="back-button"
        >
          ←
        </button>

        <h2>
          🎯 Missions
        </h2>

      </div>


      <div id="missionList"></div>

    </section>


    <!-- ======================================================
         DAILY SCREEN
    ======================================================= -->

    <section
      id="dailyScreen"
      class="screen hidden"
    >

      <div class="subscreen-header">

        <button
          id="dailyBack"
          class="back-button"
        >
          ←
        </button>

        <h2>
          🎁 Daily Reward
        </h2>

      </div>


      <div class="daily-card">

        <div id="dailyStreak"></div>

        <div id="dailyReward"></div>

        <button
          id="claimDaily"
          class="primary"
        >
          CLAIM
        </button>

      </div>

    </section>


    <!-- ======================================================
         SETTINGS SCREEN
    ======================================================= -->

    <section
      id="settingsScreen"
      class="screen hidden"
    >

      <div class="subscreen-header">

        <button
          id="settingsBack"
          class="back-button"
        >
          ←
        </button>

        <h2>
          ⚙️ Settings
        </h2>

      </div>


      <div class="settings-card">


        <!-- Sound -->

        <div class="setting-row">

          <div>

            <strong>
              Sound
            </strong>

            <small>
              Game sounds
            </small>

          </div>


          <button
            id="settingsSoundButton"
            class="setting-toggle"
          >
            🔊
          </button>

        </div>


        <!-- Music -->

        <div class="setting-row">

          <div>

            <strong>
              Music
            </strong>

            <small>
              Background music
            </small>

          </div>


          <button
            id="settingsMusicButton"
            class="setting-toggle"
          >
            🎵
          </button>

        </div>

      </div>

    </section>


    <!-- ======================================================
         RESULTS / GAME OVER SCREEN
    ======================================================= -->

    <section
      id="resultsScreen"
      class="screen hidden"
    >


      <div class="result-icon">
        🏆
      </div>


      <h2>
        Game Over
      </h2>


      <p class="big-score">

        <span id="finalScore">
          0
        </span>

        points

      </p>


      <p
        id="newBest"
        class="new-best hidden"
      >
        NEW BEST!
      </p>


      <p>

        🪙

        <span id="earnedCoins">
          0
        </span>

        coins earned

      </p>


      <!-- Home -->

      <button
        id="resultHome"
        class="primary"
      >
        🏠 Home
      </button>


      <!-- Play Again -->

      <button
        id="resultAgain"
      >
        ▶ Play Again
      </button>


    </section>


  </div>


  <!-- ======================================================
       MAIN JAVASCRIPT
  ======================================================= -->

  <script
    type="module"
    src="js/main.js"
  ></script>
</body>

</html>
